name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.1 build-tools;36.1.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # assemble + unit test + ktlint + detekt + android lint
      - name: Build
        run: ./gradlew build
        env:
          # Real token is not needed: network tests use MockWebServer (DETAILED-DESIGN §12)
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
